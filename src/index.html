<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots" />
    <meta name="author" content="Joseph Lin" />
    <meta name="keywords" content="" />
    <title>Spots</title>
  </head>
  <body class="page">
    <header class="header">
      <img src="./images/logo.svg" alt="Spots" class="header__logo" />
    </header>
    <main class="content">
      <section class="profile">
        <div class="profile__picture-container">
          <img src="./images/camera.jpg" alt="camera" class="profile__picture" />
          <button type="button" class="profile__picture-edit-button" aria-label="Edit avatar">
            <img src="./images/edit.svg" alt="Edit" class="profile__picture-edit-icon" />
            <span>Edit Avatar</span>
          </button>
        </div>
        <div class="profile__details">
          <div class="profile__info">
            <h1 class="profile__info-title">Japan Feeds</h1>
            <p class="profile__info-subheading">Japan, one spot at a time</p>
          </div>
          <div class="profile__actions">
            <button
              type="button"
              class="profile__button profile__button_type_edit"
            >
              <img
                src="./images/edit.svg"
                alt="pencil"
                class="profile__button-icon"
              />
              <span class="profile__button-text">Edit Profile</span>
            </button>
            <button
              type="button"
              class="profile__button profile__button_type_new-post"
            >
              <img
                src="./images/plus.svg"
                alt="plus sign"
                class="profile__button-icon"
              />
              <span class="profile__button-text">New Post</span>
            </button>
          </div>
        </div>
      </section>
      <section class="cards">
        <ul class="cards__list"></ul>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__content">2026 &copy; Spots</p>
    </footer>

    <div class="modal" id="edit-profile-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-button" aria-label="Close"></button>
        <h2 class="modal__title">Edit profile</h2>
        <form class="modal__form">
          <label for="profile-name-input" class="modal__label">
            Name
            <input
              id="profile-name-input"
              type="text"
              class="modal__input"
              required
              minlength="2"
              maxlength="40"
              placeholder="Type your name"
            />
            <span class="modal__error" id="profile-name-input-error" hidden></span>
          </label>
          <label for="profile-description-input" class="modal__label">
            Description
            <input
              id="profile-description-input"
              type="text"
              class="modal__input"
              required
              minlength="2"
              maxlength="200"
              placeholder="Describe yourself"
            />
            <span class="modal__error" id="profile-description-input-error" hidden></span>
          </label>
          <button type="submit" class="modal__submit-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="new-post-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-button" aria-label="Close"></button>
        <h2 class="modal__title">New Post</h2>
        <form class="modal__form">
          <label for="post-image-input" class="modal__label">
            Image Link
            <input
              id="post-image-input"
              type="url"
              class="modal__input"
              required
              placeholder="Paste a link to the picture"
            />
            <span class="modal__error" id="post-image-input-error" hidden></span>
          </label>
          <label for="post-caption-input" class="modal__label">
            Caption
            <input
              id="post-caption-input"
              type="text"
              class="modal__input"
              required
              minlength="2"
              maxlength="30"
              placeholder="Type your caption"
            />
            <span class="modal__error" id="post-caption-input-error" hidden></span>
          </label>
          <button type="submit" class="modal__submit-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__container modal__container_type_preview">
        <button type="button" class="modal__close-button" aria-label="Close"></button>
        <p class="modal__caption"></p>
      </div>
    </div>

    <div class="modal" id="edit-avatar-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-button" aria-label="Close"></button>
        <h2 class="modal__title">Edit profile avatar</h2>
        <form class="modal__form">
          <label for="avatar-link-input" class="modal__label">
            Profile picture
            <input
              id="avatar-link-input"
              type="url"
              class="modal__input"
              required
              placeholder="Paste a link to the picture"
            />
            <span class="modal__error" id="avatar-link-input-error" hidden></span>
          </label>
          <button type="submit" class="modal__submit-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="delete-card-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-button" aria-label="Close"></button>
        <h2 class="modal__title modal__title_type_delete">Are you sure you want to delete this image?</h2>
        <form class="modal__form modal__form_type_delete">
          <div class="modal__delete-actions">
            <button type="submit" class="modal__submit-button modal__submit-button_type_delete">Delete</button>
            <button type="button" class="modal__cancel-button">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <template id="card-template">
      <li class="card">
        <button type="button" class="card__delete-button" aria-label="Delete card"></button>
        <img class="card__image" />
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button type="button" class="card__like-button">
            <img
              src="./images/like.svg"
              alt="Like"
              class="card__like-icon"
            />
          </button>
        </div>
      </li>
    </template>

  </body>
</html>
